name: CI

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - '*'

jobs:
  build:
    # Keep the ".x" suffix so the job name matches the branch-protection
    # required contexts ("Node 20.x" etc.). mise resolves e.g. "20" to the
    # latest 20.x, so the label stays accurate.
    name: 'Node ${{ matrix.node-version }}.x'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          mise_toml: |
            [tools]
            node = "${{ matrix.node-version }}"
      - name: install dependencies
        run: npm ci
      - run: npm test

  release-it-compat:
    name: 'release-it@${{ matrix.release-it-version }}'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        release-it-version:
          ['^17.0.0', '^18.0.0', '^19.0.0', '^20.0.0', '^21.0.0']

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # Install from the lockfile, then swap in the target release-it version.
      # Resolving everything from scratch picks up whatever was published last,
      # and npm 10 crashes on the peer graph under vite's optional
      # @vitejs/devtools peer ("Cannot read properties of null (reading
      # 'edgesOut')").
      - name: install dependencies
        run: |
          npm ci
          npm install --save-dev release-it@${{ matrix.release-it-version }}
      - run: npm test
